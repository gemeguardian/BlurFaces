plugin_description: "Автоматически скрывает лица в видеосообщениях (кружках) в реальном времени."
settings_header: "Настройки"
settings_blur_by_default: "Размывать по умолчанию"
settings_blur_by_default_subtext: "Включать размытие сразу при открытии камеры кружка. В самой камере всегда есть кнопка, чтобы переключить размытие вручную."
settings_width: "Размер кружка"
settings_width_subtext: "Меньше — ниже задержка и нагрузка; больше — выше детализация видео"
width_auto: "Авто"
width_fast: "320 × 320 · быстро"
width_balanced: "384 × 384 · баланс"
width_quality: "448 × 448 · качество"
width_maximum: "512 × 512 · максимум"
settings_mask_mode: "Стиль защиты"
settings_mask_mode_subtext: "Размытие выглядит плавно, пикселизация явно скрывает лицо, а сплошная маска даёт максимальное визуальное сокрытие."
mask_mode_blur: "Гауссово размытие"
mask_mode_pixelate: "Пикселизация"
mask_mode_solid: "Сплошная маска"
settings_range: "Чувствительность"
settings_range_subtext: "Выше чувствительность — принимаются менее различимые лица. Для защиты стоит перестраховаться: лишнее размытие безвредно, пропущенное лицо — нет"
range_normal: "Обычная"
range_extended: "Повышенная"
range_far: "Высокая"
debug_header: "Локальная диагностика"
debug_capture: "Сохранять debug-кадры · 5 минут"
debug_warning: "Внимание: сохраняются НЕРАЗМЫТЫЕ кадры камеры и кропы лиц, рамки и метрики трекера. Только локально в закрытом каталоге приложения, без отправки. До 2 кадров/с, максимум 300 архивов / 32 МиБ. Запись выключается через 5 минут или при перезагрузке плагина/приложения; файлы остаются до удаления (старше суток очищаются при следующей настройке debug). Включайте только с согласия людей в кадре."
debug_status: "Обновить статус и показать путь"
debug_clear: "Остановить debug и удалить записи"
debug_unavailable: "Плагин ещё не запущен или требует перезапуска приложения. Debug выключен."
