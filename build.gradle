plugins {
    id 'com.android.library' version '8.2.2'
}

android {
    namespace 'com.makey.blurfaces'
    compileSdk 35
    defaultConfig { minSdk 26 }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

repositories { google(); mavenCentral(); maven { url 'https://maven.aliucord.com/snapshots' } }

// D8 must receive MediaPipe and all of its Java dependencies in the same DEX
// archive as Main. A child loader cannot resolve references made by a parent-
// loaded plugin class, so keeping this separate would only fail at runtime.
configurations { mediaPipeRuntime }

dependencies { mediaPipeRuntime 'com.google.mediapipe:tasks-vision:0.10.29' }

tasks.register("extractMediaPipeRuntime") {
    outputs.dir "$buildDir/mediapipe-jars"
    doLast {
        def destination = file("$buildDir/mediapipe-jars")
        delete destination; mkdir destination
        configurations.mediaPipeRuntime.files.each { artifact ->
            def key = artifact.name.replaceAll('[^A-Za-z0-9._-]', '_')
            if (artifact.name.endsWith('.aar')) {
                copy { from zipTree(artifact); include 'classes.jar'; into "$destination/$key" }
            } else if (artifact.name.endsWith('.jar')) {
                copy { from artifact; into "$destination/$key" }
            }
        }
    }
}

tasks.register("aarToCoreDex") {
    dependsOn "assembleRelease"
    doLast {
        def ownAar = file("$buildDir/outputs/aar/${project.name}-release.aar")
        def inputDir = file("$buildDir/dex-input")
        delete inputDir; mkdir inputDir
        copy { from zipTree(ownAar); include 'classes.jar'; into inputDir; rename { 'plugin-classes.jar' } }
        def output = file("$buildDir/dex/core")
        delete output; mkdir output
        exec { commandLine "${android.sdkDirectory}/build-tools/36.0.0/d8", file("$inputDir/plugin-classes.jar"), "--output", output }
    }
}

tasks.register("mediaPipeToDex") {
    dependsOn "extractMediaPipeRuntime"
    doLast {
        def output = file("$buildDir/dex/mesh")
        delete output; mkdir output
        def inputs = fileTree("$buildDir/mediapipe-jars") { include '**/*.jar' }.files
        exec { commandLine(["${android.sdkDirectory}/build-tools/36.0.0/d8"] + inputs.toList() + ["--output", output.absolutePath]) }
    }
}

tasks.register("stageDex") {
    dependsOn "aarToCoreDex", "mediaPipeToDex"
    doLast {
        def output = file("$buildDir/dex")
        copy { from "$output/core/classes.dex"; into output; rename { 'core.dex' } }
        copy { from "$output/mesh/classes.dex"; into output; rename { 'mesh-runtime.dex' } }
    }
}

tasks.register("buildDex") { dependsOn "stageDex" }

// Extract the MediaPipe arm64 runtime for HTTPS distribution alongside the
// verified model. It remains optional: failure to load it cannot change blur.
tasks.register("extractMeshNative") {
    dependsOn "extractMediaPipeRuntime"
    outputs.file "$buildDir/mesh-runtime/libmediapipe_tasks_vision_jni.so"
    doLast {
        def output = file("$buildDir/mesh-runtime/libmediapipe_tasks_vision_jni.so")
        output.parentFile.mkdirs()
        def vision = configurations.mediaPipeRuntime.files.find { it.name.startsWith('tasks-vision-') }
        copy { from zipTree(vision); include 'jni/arm64-v8a/libmediapipe_tasks_vision_jni.so'; into output.parentFile }
        def nested = file("$buildDir/mesh-runtime/jni/arm64-v8a/libmediapipe_tasks_vision_jni.so")
        if (nested.exists()) { output.delete(); nested.renameTo(output); file("$buildDir/mesh-runtime/jni").deleteDir() }
    }
}

dependencies {
    compileOnly files('libs/exteragram.jar')
    compileOnly 'com.aliucord:Aliuhook:1.1.3'
    // Face Landmarker stays optional for the privacy path: the stable native
    // five-point basis remains the encoder authority. The mesh is an additive
    // detail layer for future effects and is initialized lazily at runtime.
    // Compile against the public MediaPipe API. Its runtime is separately
    // verified/downloaded and injected into this plugin's DexClassLoader.
    compileOnly 'com.google.mediapipe:tasks-vision:0.10.29'
}
